# ==============================================================================
# Especificação Declarativa de Requisitos e Contratos (SDD) — TaskAnalyzer
# Bootcamp III | CEUB | Fases 1, 2 e 3
# ==============================================================================

project:
  name: sdd-task-analyzer
  module: src/task_analyzer.py
  entrypoint: analyze_tasks
  custom_exception: TaskValidationError
  python_version: "3.11+"
  methodology: Specification-Driven Development (SDD)
  governance_model: Critical-in-the-Loop

governance:
  context_rules_file: CONTEXT_RULES.md
  allowed_runtime_dependencies:
    - python-standard-library-only (datetime, typing, __future__)
  prohibited_runtime_dependencies:
    - pandas
    - numpy
    - pydantic
    - arrow
    - python-dateutil
  allowed_test_dependencies:
    - pytest>=8.0.0
  coding_standards:
    type_hints_coverage: 100%
    float_rounding_decimals: 2
    docstrings_required: true

contracts:
  input:
    parameter_name: tasks
    type: list[dict[str, Any]]
    fields:
      id:
        type: int | str
        required: true
        description: Identificador único da tarefa operacional
      titulo:
        type: str
        required: false
        description: Título ou descrição resumida da tarefa
      prioridade:
        type: str
        required: true
        allowed_values: ["alta", "media", "baixa"]
        case_insensitive: true
      status:
        type: str
        required: true
        allowed_values: ["concluida", "pendente"]
        case_insensitive: true
      data_criacao:
        type: str (ISO 8601) | datetime
        required: true
        description: Timestamp de abertura da tarefa
      data_conclusao:
        type: str (ISO 8601) | datetime | None
        required_when: status == "concluida"
        description: Timestamp de encerramento da tarefa
      prazo_estimado_horas:
        type: float | int | None
        required: false
        description: Limite de horas estimado para entrega sem atraso
      data_prazo:
        type: str (ISO 8601) | datetime | None
        required: false
        description: Data/hora limite (deadline) para entrega sem atraso
      atrasada:
        type: bool | None
        required: false
        description: Flag explícita opcional indicando entrega fora do prazo

  output:
    type: dict[str, Any]
    schema:
      total_tarefas:
        type: int
        formula: "len(tasks)"
      total_concluidas:
        type: int
        formula: "count(task where status == 'concluida')"
      total_pendentes:
        type: int
        formula: "count(task where status == 'pendente')"
      tempo_medio_conclusao_horas:
        type: dict[str, float]
        keys:
          geral: "round(sum(duracoes_concluidas) / total_concluidas, 2) if total_concluidas > 0 else 0.0"
          alta: "round(mean(duracoes_alta), 2) if count(concluidas_alta) > 0 else 0.0"
          media: "round(mean(duracoes_media), 2) if count(concluidas_media) > 0 else 0.0"
          baixa: "round(mean(duracoes_baixa), 2) if count(concluidas_baixa) > 0 else 0.0"
      taxa_atraso_percentual:
        type: float
        formula: "round((concluidas_com_atraso / total_concluidas) * 100.0, 2) if total_concluidas > 0 else 0.0"

validation_rules:
  - id: VAL-01
    name: TemporalConsistencyCheck
    condition: "data_conclusao < data_criacao"
    expected_exception: TaskValidationError
    description: Bloqueia anomalias temporais onde a conclusão antecede a criação da tarefa.
  - id: VAL-02
    name: CompletedTaskRequiresCompletionDate
    condition: "status == 'concluida' and data_conclusao is None"
    expected_exception: TaskValidationError
    description: Exige data_conclusao preenchida para toda tarefa concluída.
  - id: VAL-03
    name: DomainValidation
    condition: "prioridade not in {'alta', 'media', 'baixa'} or status not in {'concluida', 'pendente'}"
    expected_exception: TaskValidationError
    description: Garante que status e prioridade pertençam estritamente ao domínio do SDD.
  - id: VAL-04
    name: ZeroDivisionPrevention
    condition: "len(tasks) == 0 or total_concluidas == 0"
    expected_behavior: "Retornar 0.0 em todas as médias e na taxa de atraso sem disparar ZeroDivisionError."

devops_and_quality_gates:
  test_suite: tests/test_harness.py
  command: pytest tests/test_harness.py -v
  minimum_pass_rate: 100%
  ci_cd:
    provider: GitHub Actions
    workflow_file: .github/workflows/ci.yml
    runner: ubuntu-latest
    python_version: "3.11"
    trigger_branches: ["main", "develop"]
    trigger_events: ["push", "pull_request"]
  containerization:
    base_image: python:3.11-slim
    dockerfile: Dockerfile
    compose_file: docker-compose.yml
    default_cmd: ["pytest", "tests/test_harness.py", "-v"]
